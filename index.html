<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내 주요기업 자금조달</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-root">
  <div class="wrap">
    <header>
      <div>
        <h1>국내 주요기업 자금조달</h1>
        <p class="subtitle">회사채·유상증자 및 IPO·전환사채·신주인수권부사채·교환사채·영구채 등 국내 주요 기업 자금조달 소식을 건별로 확인</p>
      </div>
    </header>

    <nav class="tab-nav" id="tabNav">
      <button class="tab-btn" data-target="screen-home" type="button">홈</button>
      <button class="tab-btn" data-target="screen-detail" type="button">건별 상세</button>
      <button class="tab-btn" data-target="screen-stats" type="button">통계/분포</button>
    </nav>

    <main>
      <section class="screen" id="screen-home">
        <div class="card">
          <h2>조회 기간</h2>
          <p class="desc">공시일 기준으로 기간을 선택하면 아래 목록·합계·통계/분포 화면에 함께 반영됩니다.</p>
          <div class="date-filter-row">
            <input type="date" id="filterStartInput">
            <span class="date-filter-sep">~</span>
            <input type="date" id="filterEndInput">
            <button class="save-btn" id="applyFilterBtn" type="button">적용</button>
            <button class="back-link" id="resetFilterBtn" type="button">전체 기간 보기</button>
          </div>
          <p class="filter-error" id="filterError"></p>
          <div class="preset-row">
            <button class="preset-btn" type="button" data-preset="7">최근 1주일</button>
            <button class="preset-btn" type="button" data-preset="30">최근 1개월</button>
          </div>
          <p class="live-fetch-status" id="liveFetchStatus"></p>
          <p class="filter-subheading">자금조달 방식 (누르면 켜고 끕니다)</p>
          <div class="category-filter-row" id="categoryFilterRow">
            <button class="category-btn" type="button" data-category="all">전체</button>
            <button class="category-btn" type="button" data-category="회사채">회사채</button>
            <button class="category-btn" type="button" data-category="유상증자 및 IPO">유상증자 및 IPO</button>
            <button class="category-btn" type="button" data-category="전환사채">전환사채</button>
            <button class="category-btn" type="button" data-category="신주인수권부사채">신주인수권부사채</button>
            <button class="category-btn" type="button" data-category="교환사채">교환사채</button>
            <button class="category-btn" type="button" data-category="영구채">영구채</button>
          </div>
        </div>

        <div class="card" id="summaryCard"></div>

        <div class="card">
          <h2>자금조달 목록</h2>
          <p class="desc">DART 전자공시(dsac001/mainAll.do) 기준 자금조달 건입니다. 항목을 클릭하면 상세 화면으로 이동합니다.</p>
          <div class="company-search-row">
            <input type="text" id="companySearchInput" placeholder="회사명 검색 (예: SK하이닉스)">
            <button class="back-link" id="clearCompanySearchBtn" type="button">지우기</button>
          </div>
          <ul class="funding-list" id="fundingList"></ul>
        </div>
      </section>

      <section class="screen" id="screen-detail">
        <div class="card">
          <h2>건별 상세</h2>
          <div id="detailContent"></div>
        </div>
      </section>

      <section class="screen" id="screen-stats">
        <div class="card">
          <h2>조달방식별 합계</h2>
          <p class="desc" id="statsFilterNote"></p>
          <ul class="stat-list" id="methodStatsList"></ul>
        </div>

        <div class="card">
          <h2>업종별 합계</h2>
          <ul class="stat-list" id="sectorStatsList"></ul>
        </div>

        <div class="card" id="ratioCard"></div>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
